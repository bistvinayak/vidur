<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vidur — History</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb;
    --accent: #2563eb; --bubble-assistant: #f3f4f6; --bubble-user: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #f2f2f2; --muted: #9ca3af; --border: #2b2d31; --bubble-assistant: #24262b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); }
  .layout { display: flex; height: 100vh; }
  .sidebar { width: 280px; border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; flex-shrink: 0; }
  .sidebar h1 { font-size: 16px; margin: 4px 4px 12px; }
  .thread-item { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; color: var(--fg); font: inherit; }
  .thread-item.active { border-color: var(--accent); }
  .thread-item .title { display: block; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-item .domain { display: block; font-size: 11px; color: var(--muted); }
  .main { flex: 1; overflow-y: auto; padding: 24px; max-width: 720px; }
  .main h2 { margin-top: 0; }
  .main a.source-link { font-size: 12px; color: var(--muted); }
  .bubble { position: relative; border-radius: 10px; padding: 10px 56px 10px 14px; font-size: 14px; line-height: 1.5; max-width: 90%; margin-bottom: 12px; white-space: pre-wrap; }
  .bubble-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
  .copy-btn { background: none; border: none; cursor: pointer; font-size: 13px; opacity: 0.55; color: inherit; padding: 2px; line-height: 1; }
  .copy-btn:hover { opacity: 1; }
  .mic-btn { background: var(--bubble-assistant); border: 1px solid var(--border); color: var(--fg); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .main-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bubble.assistant { background: var(--bubble-assistant); }
  .bubble.user { background: var(--bubble-user); color: #fff; margin-left: auto; }
  .actionable-list { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
  .empty { color: var(--muted); padding: 24px; }
  .composer { display: flex; gap: 8px; margin-top: 16px; }
  .composer input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; background: var(--bg); color: var(--fg); }
  .composer button { border: none; border-radius: 8px; background: var(--accent); color: #fff; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .composer button:disabled { opacity: 0.5; cursor: default; }
  .composer-error { color: #dc2626; font-size: 12px; margin: 6px 0 0; }
  .bubble.thinking { color: var(--muted); font-style: italic; }
  .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin: 4px 4px 12px; }
  .sidebar-header h1 { font-size: 16px; margin: 0; }
  .icon-btn { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--fg); padding: 2px 4px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: var(--bg); color: var(--fg); border-radius: 12px; padding: 20px; width: 360px; max-width: 90vw; max-height: 85vh; overflow-y: auto; }
  .modal h2 { margin-top: 0; font-size: 15px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 600; }
  .hint { font-size: 11px; color: var(--muted); margin: 0; }
  .field input, .field select { border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 13px; background: var(--bg); color: var(--fg); font-family: inherit; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .modal-actions button { border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .modal-actions .save-btn { background: var(--accent); color: #fff; }
  .modal-actions .cancel-btn { background: var(--bubble-assistant); color: var(--fg); }
</style>
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>Vidur</h1>
        <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
      </div>
      <div id="thread-list">Loading…</div>
    </div>
    <div class="main" id="main">
      <p class="empty">Select a conversation on the left.</p>
    </div>
  </div>
  <div id="settings-root"></div>

<script>
  // The extension's ID is pinned via the "key" field in manifest.config.ts,
  // so this stays correct even if the extension is reloaded from a
  // different path — update this only if you ever regenerate that key.
  const EXTENSION_ID = 'cojjeeofpghidendcnemfpppjmcgbnah'

  // Kept in sync by hand with src/lib/types.ts — this plain page has no
  // build step to import them from, so if that file's model lists change,
  // update these too.
  const PROVIDERS = {
    openrouter: {
      label: 'OpenRouter (free)',
      keyField: 'openrouterApiKey',
      modelField: 'openrouterModel',
      keyPlaceholder: 'sk-or-v1-…',
      keyHint: 'Free account at openrouter.ai/keys.',
      models: [
        { id: 'inclusionai/ling-3.0-flash-vl:free', label: 'Ling 3.0 Flash VL — Recommended' },
        { id: 'nex-agi/nex-n2.5-pro:free', label: 'Nex N2.5 Pro' },
        { id: 'nex-agi/nex-n2.5-mini:free', label: 'Nex N2.5 Mini' },
        { id: 'thinkingmachines/inkling:free', label: 'Inkling (huge context, no tool calling)' },
        { id: 'cohere/north-mini-code:free', label: 'North Mini Code (no vision)' },
      ],
    },
    anthropic: {
      label: 'Claude (Anthropic, paid)',
      keyField: 'anthropicApiKey',
      modelField: 'anthropicModel',
      keyPlaceholder: 'sk-ant-…',
      keyHint: 'Your own Anthropic API key — usage is billed to your account.',
      models: [
        { id: 'claude-haiku-4-5-20251001', label: 'Claude Haiku 4.5 (fastest/cheapest)' },
        { id: 'claude-sonnet-5', label: 'Claude Sonnet 5 — Recommended' },
        { id: 'claude-opus-5', label: 'Claude Opus 5 (most capable)' },
      ],
    },
    openai: {
      label: 'GPT (OpenAI, paid)',
      keyField: 'openaiApiKey',
      modelField: 'openaiModel',
      keyPlaceholder: 'sk-…',
      keyHint: 'Your own OpenAI API key — usage is billed to your account.',
      models: [
        { id: 'gpt-5.6-luna', label: 'GPT-5.6 Luna — Recommended' },
        { id: 'gpt-5.6-sol', label: 'GPT-5.6 Sol (flagship)' },
        { id: 'gpt-6-astra', label: 'GPT-6 Astra (most capable)' },
      ],
    },
  }

  let threads = []
  let activeId = null
  let sending = false

  async function load() {
    const res = await fetch('/api/threads')
    threads = await res.json()
    if (activeId) {
      selectThread(activeId) // refresh with any new messages (e.g. after sendReply)
    } else {
      renderList()
      if (threads.length) selectThread(threads[0].id)
    }
  }

  function renderList() {
    const el = document.getElementById('thread-list')
    if (!threads.length) {
      el.innerHTML = '<p class="empty">No conversations yet — use the Vidur extension to summarize a page.</p>'
      return
    }
    el.innerHTML = threads.map(t => `
      <button class="thread-item ${t.id === activeId ? 'active' : ''}" data-id="${escapeAttr(t.id)}">
        <span class="title">${escapeHtml(t.title || t.domain)}</span>
        <span class="domain">${escapeHtml(t.domain)}${t.skillLabel && t.skillLabel !== 'General page' ? ' · ' + escapeHtml(t.skillLabel) : ''}</span>
      </button>
    `).join('')
    el.querySelectorAll('.thread-item').forEach(btn => {
      btn.addEventListener('click', () => selectThread(btn.dataset.id))
    })
  }

  function formatMessageForCopy(m) {
    const items = (m.actionableItems || []).map(a => `- ${a.label}${a.detail ? ': ' + a.detail : ''}`).join('\n')
    return m.content + (items ? '\n\n' + items : '')
  }

  function formatThreadForCopy(thread) {
    const header = `${thread.title || thread.domain}\n${thread.url}\n`
    const body = thread.messages.map(m => `${m.role === 'user' ? 'You' : 'Vidur'}: ${formatMessageForCopy(m)}`).join('\n\n')
    return `${header}\n${body}`
  }

  function copyBtnClick(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent
      btn.textContent = '✓'
      setTimeout(() => { btn.textContent = original }, 1500)
    }).catch(() => {
      const el = document.getElementById('composer-error')
      if (el) { el.textContent = 'Could not copy — your browser may be blocking clipboard access.'; el.hidden = false }
    })
  }

  let currentUtteranceBtn = null
  function speakBtnClick(btn, text) {
    if (currentUtteranceBtn === btn) {
      window.speechSynthesis.cancel()
      btn.textContent = '🔊'
      currentUtteranceBtn = null
      return
    }
    window.speechSynthesis.cancel()
    if (currentUtteranceBtn) currentUtteranceBtn.textContent = '🔊'
    const utterance = new SpeechSynthesisUtterance(text)
    const reset = () => { btn.textContent = '🔊'; currentUtteranceBtn = null }
    utterance.onend = reset
    utterance.onerror = reset
    btn.textContent = '⏹'
    currentUtteranceBtn = btn
    window.speechSynthesis.speak(utterance)
  }

  function getSpeechRecognition() {
    const Impl = window.SpeechRecognition || window.webkitSpeechRecognition
    return Impl ? new Impl() : null
  }

  function selectThread(id) {
    activeId = id
    renderList()
    const thread = threads.find(t => t.id === id)
    const main = document.getElementById('main')
    if (!thread) { main.innerHTML = '<p class="empty">Not found.</p>'; return }

    main.innerHTML = `
      <div class="main-header">
        <h2>${escapeHtml(thread.title || thread.domain)}</h2>
        <div>
          <button class="icon-btn" id="speak-thread-btn" title="Read whole conversation aloud">🔊</button>
          <button class="icon-btn" id="copy-thread-btn" title="Copy whole conversation">⧉</button>
        </div>
      </div>
      <a class="source-link" href="${escapeAttr(thread.url)}" target="_blank" rel="noopener">${escapeHtml(thread.url)}</a>
      ${thread.skillLabel && thread.skillLabel !== 'General page' ? `<p class="hint" style="margin-top:4px">Detected as: ${escapeHtml(thread.skillLabel)}</p>` : ''}
      <div style="margin-top:16px">
        ${thread.messages.map(renderMessage).join('')}
        ${sending ? '<div class="bubble assistant thinking">Thinking…</div>' : ''}
      </div>
      <form class="composer" id="composer">
        <input id="composer-input" placeholder="Ask a follow-up…" ${sending ? 'disabled' : ''} autocomplete="off" />
        <button type="button" class="mic-btn" id="mic-btn" title="Speak instead">🎤</button>
        <button type="submit" ${sending ? 'disabled' : ''}>Send</button>
      </form>
      <p class="composer-error" id="composer-error" hidden></p>
    `
    document.getElementById('composer').addEventListener('submit', (e) => {
      e.preventDefault()
      const input = document.getElementById('composer-input')
      const text = input.value.trim()
      if (text) sendReply(thread.id, text)
    })
    document.getElementById('mic-btn').addEventListener('click', (e) => {
      const recognition = getSpeechRecognition()
      const input = document.getElementById('composer-input')
      if (!recognition) {
        const el = document.getElementById('composer-error')
        el.textContent = 'Voice input is not supported in this browser.'
        el.hidden = false
        return
      }
      recognition.lang = 'en-US'
      recognition.onresult = (ev) => { input.value = ev.results[0][0].transcript }
      recognition.onstart = () => { e.target.textContent = '●'; input.placeholder = 'Listening…' }
      const reset = () => { e.target.textContent = '🎤'; input.placeholder = 'Ask a follow-up…' }
      recognition.onerror = reset
      recognition.onend = reset
      recognition.start()
    })
    document.getElementById('copy-thread-btn').addEventListener('click', (e) => copyBtnClick(e.target, formatThreadForCopy(thread)))
    document.getElementById('speak-thread-btn').addEventListener('click', (e) => speakBtnClick(e.target, formatThreadForCopy(thread)))
    document.querySelectorAll('.copy-msg-btn').forEach(btn => {
      const msg = thread.messages[Number(btn.dataset.idx)]
      btn.addEventListener('click', (e) => copyBtnClick(e.target, formatMessageForCopy(msg)))
    })
    document.querySelectorAll('.speak-msg-btn').forEach(btn => {
      const msg = thread.messages[Number(btn.dataset.idx)]
      btn.addEventListener('click', (e) => speakBtnClick(e.target, formatMessageForCopy(msg)))
    })
  }

  function sendReply(threadId, text) {
    const errorEl = document.getElementById('composer-error')
    errorEl.hidden = true

    if (!window.chrome || !chrome.runtime || !chrome.runtime.sendMessage) {
      errorEl.textContent = 'Cannot reach the Vidur extension from this browser/tab. Reply from the extension\'s side panel instead.'
      errorEl.hidden = false
      return
    }

    sending = true
    selectThread(threadId) // re-render with composer disabled + "Thinking…"

    chrome.runtime.sendMessage(EXTENSION_ID, { type: 'CONTINUE_THREAD', threadId, text }, (response) => {
      sending = false
      if (chrome.runtime.lastError || !response) {
        const el = document.getElementById('composer-error')
        if (el) {
          el.textContent = 'Could not reach the extension — is it installed and enabled? (' +
            (chrome.runtime.lastError ? chrome.runtime.lastError.message : 'no response') + ')'
          el.hidden = false
        }
        return
      }
      if (!response.ok) {
        const el = document.getElementById('composer-error')
        if (el) { el.textContent = response.error; el.hidden = false }
        return
      }
      load() // pulls the persisted thread (with the new reply) back from the server
    })
  }

  function renderMessage(m, idx) {
    const items = (m.actionableItems || []).length
      ? `<ul class="actionable-list">${m.actionableItems.map(a => `<li><strong>${escapeHtml(a.label)}</strong>${a.detail ? ' — ' + escapeHtml(a.detail) : ''}</li>`).join('')}</ul>`
      : ''
    return `<div class="bubble ${m.role}">
      <div class="bubble-actions">
        <button class="copy-btn speak-msg-btn" data-idx="${idx}" title="Read aloud">🔊</button>
        <button class="copy-btn copy-msg-btn" data-idx="${idx}" title="Copy this message">⧉</button>
      </div>
      ${escapeHtml(m.content)}${items}
    </div>`
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
  }
  function escapeAttr(s) { return escapeHtml(s) }

  function callExtension(message) {
    return new Promise((resolve, reject) => {
      if (!window.chrome || !chrome.runtime || !chrome.runtime.sendMessage) {
        reject(new Error('Cannot reach the Vidur extension from this browser/tab.'))
        return
      }
      chrome.runtime.sendMessage(EXTENSION_ID, message, (response) => {
        if (chrome.runtime.lastError) return reject(new Error(chrome.runtime.lastError.message))
        if (!response) return reject(new Error('No response from the extension.'))
        if (!response.ok) return reject(new Error(response.error))
        resolve(response)
      })
    })
  }

  async function openSettings() {
    const root = document.getElementById('settings-root')
    root.innerHTML = '<div class="modal-backdrop"><div class="modal"><p>Loading settings…</p></div></div>'

    let settings
    try {
      ;({ settings } = await callExtension({ type: 'GET_SETTINGS' }))
    } catch (err) {
      root.innerHTML = `<div class="modal-backdrop"><div class="modal"><p class="composer-error" style="display:block">${escapeHtml(err.message)}</p><div class="modal-actions"><button class="cancel-btn" id="settings-close">Close</button></div></div></div>`
      document.getElementById('settings-close').addEventListener('click', () => { root.innerHTML = '' })
      return
    }

    renderSettingsForm(settings)
  }

  function renderSettingsForm(settings) {
    const root = document.getElementById('settings-root')
    const provider = PROVIDERS[settings.provider] || PROVIDERS.openrouter

    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal">
          <h2>Vidur — Settings</h2>
          <div class="field">
            <label>Model provider</label>
            <select id="s-provider">
              ${Object.keys(PROVIDERS).map(key => `<option value="${key}" ${key === settings.provider ? 'selected' : ''}>${PROVIDERS[key].label}</option>`).join('')}
            </select>
          </div>
          <div class="field" id="s-model-field">
            <label>Model</label>
            <select id="s-model">
              ${provider.models.map(m => `<option value="${m.id}" ${m.id === settings[provider.modelField] ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
          </div>
          <div class="field" id="s-key-field">
            <label id="s-key-label"></label>
            <input id="s-key" type="password" placeholder="" />
            <p class="hint" id="s-key-hint"></p>
          </div>
          <div class="field">
            <label>Output language</label>
            <input id="s-lang" value="${escapeAttr(settings.outputLanguage || '')}" placeholder="Leave blank to match the page's language" />
          </div>
          <p class="composer-error" id="s-error" hidden></p>
          <div class="modal-actions">
            <button class="cancel-btn" id="settings-cancel">Cancel</button>
            <button class="save-btn" id="settings-save">Save</button>
          </div>
        </div>
      </div>
    `

    function refreshProviderFields(providerKey) {
      const p = PROVIDERS[providerKey]
      document.getElementById('s-model').innerHTML = p.models.map(m =>
        `<option value="${m.id}" ${m.id === settings[p.modelField] ? 'selected' : ''}>${m.label}</option>`
      ).join('')
      document.getElementById('s-key-label').textContent = p.label + ' API key'
      document.getElementById('s-key-hint').textContent = p.keyHint + ' Stored only in the extension (chrome.storage.local).'
      document.getElementById('s-key').placeholder = settings[p.keyField + 'Set'] ? 'Already set — leave blank to keep it' : p.keyPlaceholder
    }
    refreshProviderFields(settings.provider)

    document.getElementById('s-provider').addEventListener('change', (e) => refreshProviderFields(e.target.value))
    document.getElementById('settings-cancel').addEventListener('click', () => { root.innerHTML = '' })

    document.getElementById('settings-save').addEventListener('click', async () => {
      const providerKey = document.getElementById('s-provider').value
      const p = PROVIDERS[providerKey]
      const update = {
        provider: providerKey,
        outputLanguage: document.getElementById('s-lang').value.trim(),
        [p.modelField]: document.getElementById('s-model').value,
      }
      const keyValue = document.getElementById('s-key').value.trim()
      if (keyValue) update[p.keyField] = keyValue // blank = leave existing key untouched

      try {
        await callExtension({ type: 'SAVE_SETTINGS', settings: update })
        root.innerHTML = ''
      } catch (err) {
        const el = document.getElementById('s-error')
        el.textContent = err.message
        el.hidden = false
      }
    })
  }

  document.getElementById('settings-btn').addEventListener('click', openSettings)

  load()
  setInterval(load, 5000) // picks up new summaries pushed from the extension without a manual refresh
</script>
</body>
</html>
